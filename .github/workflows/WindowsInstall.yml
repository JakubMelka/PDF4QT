name: Windows_MSI
# A build without the signature is marked in the name of the run, Create_Release_Draft does not take it
run-name: ${{ inputs.sign_msi && 'Windows_MSI' || 'Windows_MSI (unsigned test build)' }}

on:
  workflow_dispatch:
    inputs:
      sign_msi:
        description: 'Sign the MSI package (uses a signature of DigiCert KeyLocker), a release needs a signed build'
        type: boolean
        default: true

permissions:
  contents: read

env:
  QT_VERSION: '6.11.3'
  QT_MODULES: 'qtspeech qtmultimedia qtimageformats'
  # aqtinstall 3.3 cannot read the Windows repository layout of Qt 6.11+, use a commit of its master until a
  # release supports it
  AQT_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
  # Release only triplet, the dependencies are built once, not in the debug and release configuration
  VCPKG_TRIPLET: x64-windows-release
  SIGN_MSI: ${{ vars.SIGN_MSI == 'true' && inputs.sign_msi }}

jobs:
  build_windows:
    # The image contains Visual Studio 2022 (redistributables of MSVC) and WiX Toolset v3
    runs-on: windows-2022
    timeout-minutes: 150
    permissions:
      contents: read
      # GitHub artifact attestations of the packages
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      SM_HOST: ${{ secrets.SM_HOST }}
      SM_API_KEY: ${{ secrets.SM_API_KEY }}
      SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
      SM_CLIENT_CERT_FILE: ${{ github.workspace }}\JM_AuthCert.p12

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: pdf4qt

      - name: Set up paths
        run: |
          # Paths with forward slashes (CMake and vcpkg accept them also on Windows)
          workspace="$(cygpath -m "$GITHUB_WORKSPACE")"
          {
            echo "VCPKG_ROOT=$workspace/vcpkg"
            echo "VCPKG_INSTALLED_DIR=$workspace/vcpkg_installed"
            echo "VCPKG_DEFAULT_BINARY_CACHE=$workspace/vcpkg-binary-cache"
            echo "VCPKG_DISABLE_METRICS=1"
          } >> "$GITHUB_ENV"

      - name: Add MakeAppx to PATH
        shell: pwsh
        run: |
          # The newest Windows SDK, which contains MakeAppx.exe
          $basePath = "C:\Program Files (x86)\Windows Kits\10\bin"
          $sdkPath = Get-ChildItem -Path $basePath -Directory | Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName "x64" } |
            Where-Object { Test-Path (Join-Path $_ "MakeAppx.exe") } | Select-Object -First 1
          if (-not $sdkPath) {
            Write-Error "MakeAppx.exe not found in any Windows SDK directories"
            exit 1
          }
          Write-Host "Adding $sdkPath to PATH"
          echo "$sdkPath" >> $env:GITHUB_PATH

      - name: 'Signing: Install Keylocker KSP'
        if: env.SIGN_MSI == 'true'
        shell: pwsh
        env:
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
        run: |
          [System.IO.File]::WriteAllBytes($env:SM_CLIENT_CERT_FILE, [Convert]::FromBase64String($env:SM_CLIENT_CERT_FILE_B64))
          $hash = Get-FileHash -Path $env:SM_CLIENT_CERT_FILE -Algorithm SHA256
          Write-Host "Authorization certificate hash: $($hash.Hash)"

          echo "C:\Program Files (x86)\Windows Kits\10\App Certification Kit" >> $env:GITHUB_PATH
          echo "C:\Program Files (x86)\Microsoft SDKs\Windows\v10.0A\bin\NETFX 4.8 Tools" >> $env:GITHUB_PATH
          echo "C:\Program Files\DigiCert\DigiCert Keylocker Tools" >> $env:GITHUB_PATH

          curl.exe -sSf -X GET https://one.digicert.com/signingmanager/api-ui/v1/releases/Keylockertools-windows-x64.msi/download -H "x-api-key:$env:SM_API_KEY" -o Keylockertools-windows-x64.msi
          Start-Process msiexec.exe -ArgumentList '/i', 'Keylockertools-windows-x64.msi', '/quiet', '/qn' -Wait

      # Checked before the long build, a problem of the credentials is found in a few seconds
      - name: 'Signing: Certificates Sync'
        if: env.SIGN_MSI == 'true'
        shell: pwsh
        run: |
          smctl windows certsync

      - name: 'VCPKG: Set up VCPKG'
        run: |
          # vcpkg is checked out exactly at the builtin-baseline of vcpkg.json. The ABI hashes of the binary
          # cache depend also on the scripts and tools of vcpkg, a checkout of its master would change them
          # with each commit of vcpkg and all dependencies would be built again.
          baseline="$(sed -n 's/.*"builtin-baseline": *"\([0-9a-f]*\)".*/\1/p' pdf4qt/vcpkg.json)"
          git init -q vcpkg
          git -C vcpkg remote add origin https://github.com/microsoft/vcpkg.git
          git -C vcpkg fetch -q --depth=1 origin "$baseline"
          git -C vcpkg checkout -q --detach FETCH_HEAD
          ./vcpkg/bootstrap-vcpkg.bat -disableMetrics

      # The key contains the runner image, the compiler differs from the CI build (windows-latest) and the
      # binaries of the two builds would push each other out of the cache
      - name: 'VCPKG: Restore binary cache'
        uses: actions/cache/restore@v6
        with:
          path: vcpkg-binary-cache
          key: vcpkg-bin-v1-windows-2022-${{ env.VCPKG_TRIPLET }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-bin-v1-windows-2022-${{ env.VCPKG_TRIPLET }}-

      - name: 'VCPKG: Install project dependencies'
        run: |
          mkdir -p vcpkg-binary-cache
          find vcpkg-binary-cache -type f -name '*.zip' | sort > vcpkg-cache-before.txt
          ./vcpkg/vcpkg install --x-manifest-root=pdf4qt --x-install-root="$VCPKG_INSTALLED_DIR" --triplet=$VCPKG_TRIPLET --host-triplet=$VCPKG_TRIPLET --clean-buildtrees-after-build --clean-packages-after-build

      - name: 'VCPKG: Prune binary cache'
        id: vcpkg-cache
        run: |
          # The archives of the binary cache are named by the ABI hash of the package. The archives, which were
          # not used by this build, are deleted, so the cache does not grow with outdated binaries. The cache is
          # saved only when its content has changed.
          # The directory updates exists only when the status was not yet compacted into the status file
          shopt -s nullglob
          { cat "$VCPKG_INSTALLED_DIR"/vcpkg/status "$VCPKG_INSTALLED_DIR"/vcpkg/updates/* || true; } | tr -d '\r' | sed -n 's/^Abi: *//p' | sort -u > vcpkg-cache-used.txt
          if [ -s vcpkg-cache-used.txt ]; then
            find vcpkg-binary-cache -type f -name '*.zip' | while read -r archive; do
              grep -qxF "$(basename "$archive" .zip)" vcpkg-cache-used.txt || rm -f "$archive"
            done
          else
            echo "::warning::ABI hashes of the installed packages were not found, the binary cache is not pruned"
          fi
          find vcpkg-binary-cache -type f -name '*.zip' | sort > vcpkg-cache-after.txt
          echo "Packages: $(wc -l < vcpkg-cache-after.txt), cache size: $(du -sh vcpkg-binary-cache | cut -f1)"
          if cmp -s vcpkg-cache-before.txt vcpkg-cache-after.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Saved right after the installation of the dependencies, so a failure of the build does not lose them
      - name: 'VCPKG: Save binary cache'
        if: steps.vcpkg-cache.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: vcpkg-binary-cache
          key: vcpkg-bin-v1-windows-2022-${{ env.VCPKG_TRIPLET }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Qt is cached by own steps, the automatic cache of install-qt-action has a long key containing also the
      # version of the runner image
      - name: 'Qt: Cache key'
        id: qt-key
        run: |
          hash="$(printf '%s\n' "$QT_VERSION" "windows" "win64_msvc2022_64" "$QT_MODULES" "$AQT_SOURCE" | sha256sum | cut -c1-16)"
          echo "key=$RUNNER_OS-qt-$QT_VERSION-$hash" >> "$GITHUB_OUTPUT"

      - name: 'Qt: Restore cache'
        id: qt-cache
        uses: actions/cache/restore@v6
        with:
          path: qt
          key: ${{ steps.qt-key.outputs.key }}

      - name: 'Qt: Install'
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          dir: '${{ github.workspace }}/qt/'
          modules: ${{ env.QT_MODULES }}
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: 'false'
          # The environment is set by the step below, the same for an installed and for a restored Qt
          set-env: 'false'

      - name: 'Qt: Save cache'
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: qt
          key: ${{ steps.qt-key.outputs.key }}

      - name: 'Qt: Set up environment'
        run: |
          # The same variables as install-qt-action sets
          qt_root="$(cygpath -m "$GITHUB_WORKSPACE")/qt/Qt/$QT_VERSION/msvc2022_64"
          if [ ! -d "$qt_root/bin" ]; then echo "::error::Qt not found in $qt_root"; exit 1; fi
          {
            echo "QT_ROOT_DIR=$qt_root"
            echo "QT_PLUGIN_PATH=$qt_root/plugins"
            echo "QML2_IMPORT_PATH=$qt_root/qml"
          } >> "$GITHUB_ENV"
          echo "$qt_root/bin" >> "$GITHUB_PATH"

      - name: Find VC Redistributable Directories
        shell: pwsh
        run: |
          $basePath = "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC"
          $arch = "x64"
          $redistDirs = Get-ChildItem -Path $basePath -Recurse -Directory -Filter "Microsoft.VC*.CRT" | Where-Object { $_.FullName -notmatch "debug_nonredist" -and $_.FullName -match "\\$arch\\" -and $_.FullName -notmatch "onecore" }
          if (-not $redistDirs) {
            Write-Error "No valid redistributable directories found."
            exit 1
          }
          $firstRedistDir = $redistDirs | Select-Object -First 1
          $toolsetVersion = $firstRedistDir.Name -replace '^Microsoft\.VC(\d+)\.CRT$', '$1'
          Write-Host "Found MSVC Toolset Version: $toolsetVersion"
          Write-Host "Found MSVC Redistributable Full Path: $firstRedistDir"
          echo "MSVC_TOOLSET_VERSION=$toolsetVersion" >> $env:GITHUB_ENV
          echo "VCToolsRedistDir=$($firstRedistDir.Parent.Parent.Parent.FullName)" >> $env:GITHUB_ENV
          echo "VSCMD_ARG_TGT_ARCH=$arch" >> $env:GITHUB_ENV
          echo "MSVC_REDISTRIBUTABLES_PATH=$firstRedistDir" >> $env:GITHUB_ENV

      - name: Build project
        working-directory: pdf4qt
        run: |
          # The dependencies are already installed, CMake must not run vcpkg install again into the build tree
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=$VCPKG_TRIPLET -DVCPKG_HOST_TRIPLET=$VCPKG_TRIPLET -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" -DVCPKG_MANIFEST_INSTALL=OFF -DPDF4QT_INSTALL_QT_DEPENDENCIES=ON -DPDF4QT_INSTALL_DEPENDENCIES=ON -DPDF4QT_QT_ROOT="$QT_ROOT_DIR" -DPDF4QT_INSTALL_MSVC_REDISTRIBUTABLE=ON -DPDF4QT_INSTALL_PREPARE_WIX_INSTALLER=ON -DPDF4QT_INSTALL_TO_USR=ON
          cmake --build build --target release_translations --config Release -j6
          cmake --build build --config Release -j6
          cmake --install build --config Release

      # The generator of Visual Studio is multi-configuration, the configuration is given by --config. The check
      # of the installed binaries is the real guarantee: a debug build (also a debug Qt) links the debug runtime.
      - name: Check release build
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $failed = $false
          foreach ($binary in @("Pdf4QtLibCore.dll", "Pdf4QtLibGui.dll", "Pdf4QtEditor.exe", "Pdf4QtViewer.exe")) {
            $dependents = & $dumpbin.FullName /dependents "pdf4qt\build\install\usr\bin\$binary" | Out-String
            if ($LASTEXITCODE -ne 0) { Write-Error "dumpbin failed for $binary"; exit 1 }
            if ($dependents -match '(?i)\b(VCRUNTIME140D|VCRUNTIME140_1D|MSVCP140D|UCRTBASED)\.dll') {
              Write-Host "::error::$binary is a debug build:`n$dependents"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "Release binaries confirmed"

      - name: Read version
        shell: pwsh
        run: |
          $version = (Get-Content -Path ".\pdf4qt\build\version.txt" -Raw).Trim()
          Write-Host "Version: $version"
          echo "pdf4qt_version=$version" >> $env:GITHUB_ENV
          echo "msipackagefilename=JakubMelka.PDF4QT_${version}.msi" >> $env:GITHUB_ENV
          Write-Host "MSI package file name: JakubMelka.PDF4QT_${version}.msi"

      - name: Find WiXUIExtension.dll
        shell: pwsh
        run: |
          $wixPath = "C:\Program Files (x86)\WiX Toolset v3.*\bin\WiXUIExtension.dll"
          $wixUIExtensionPath = Get-ChildItem -Path $wixPath -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $wixUIExtensionPath) {
            Write-Error "WiXUIExtension.dll not found in the expected path."
            exit 1
          }
          Write-Output "Found WiXUIExtension.dll at: $($wixUIExtensionPath.FullName)"
          echo "wixuiextpath=$($wixUIExtensionPath.FullName)" >> $env:GITHUB_ENV

      - name: Create MSI Package
        working-directory: pdf4qt\build\WixInstaller
        shell: pwsh
        run: |
          candle -v -d"SolutionDir=." -d"SolutionExt=.sln" -d"SolutionFileName=PDF4QT.sln" -d"SolutionName=PDF4QT" -d"SolutionPath=PDF4QT.sln" -d"Configuration=Release" -d"OutDir=bin\Release\" -d"Platform=x86" -d"ProjectDir=." -d"ProjectExt=.wixproj" -d"ProjectFileName=PDF4QT.wixproj" -d"ProjectName=PDF4QT" -d"ProjectPath=PDF4QT.wixproj" -d"TargetDir=bin\Release\" -d"TargetExt=.msi" -d"TargetFileName=${{ env.msipackagefilename }}" -d"TargetName=PDF4QT" -d"TargetPath=bin\Release\${{ env.msipackagefilename }}" -out obj\Release\ -arch x86 -ext "${{ env.wixuiextpath }}" Product.wxs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Light -v -out ${{ github.workspace }}\pdf4qt\build\install\${{ env.msipackagefilename }} -pdbout .\bin\Release\PDF4QT.wixpdb -cultures:null -ext "${{ env.wixuiextpath }}" -contentsfile obj\Release\PDF4QT.wixproj.BindContentsFileListnull.txt -outputsfile obj\Release\PDF4QT.wixproj.BindOutputsFileListnull.txt -builtoutputsfile obj\Release\PDF4QT.wixproj.BindBuiltOutputsFileListnull.txt -wixprojectfile .\PDF4QT.wixproj obj\Release\Product.wixobj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 'Signing: Sign MSI Package'
        if: env.SIGN_MSI == 'true'
        shell: pwsh
        env:
          SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}
        run: |
          $msi = "${{ github.workspace }}\pdf4qt\build\install\${{ env.msipackagefilename }}"
          signtool.exe sign /sha1 $env:SM_CODE_SIGNING_CERT_SHA1_HASH /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 "$msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          signtool.exe verify /v /pa "$msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create MSIX Package
        shell: pwsh
        run: |
          MakeAppx pack /d ".\pdf4qt\build\install\usr\bin" /p ".\pdf4qt\build\install\JakubMelka.PDF4QT_${{ env.pdf4qt_version }}.msix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The zip archive is created here (not by Create_Release_Draft), so the attested file is the file of the
      # release
      - name: Create ZIP archive
        shell: pwsh
        working-directory: pdf4qt\build\install\usr\bin
        run: |
          7z a -tzip -mx=9 "..\..\PDF4QT-Windows-${{ env.pdf4qt_version }}.zip" *
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Attest packages
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ github.workspace }}/pdf4qt/build/install/${{ env.msipackagefilename }}
            ${{ github.workspace }}/pdf4qt/build/install/JakubMelka.PDF4QT_${{ env.pdf4qt_version }}.msix
            ${{ github.workspace }}/pdf4qt/build/install/PDF4QT-Windows-${{ env.pdf4qt_version }}.zip

      - name: Upload ZIP archive
        uses: actions/upload-artifact@v7
        with:
          name: 'PDF4QT-Windows-${{ env.pdf4qt_version }}.zip'
          path: .\pdf4qt\build\install\PDF4QT-Windows-${{ env.pdf4qt_version }}.zip
          retention-days: 7
          compression-level: 0

      - name: Upload MSIX package
        uses: actions/upload-artifact@v7
        with:
          name: 'JakubMelka.PDF4QT_${{ env.pdf4qt_version }}.msix'
          path: .\pdf4qt\build\install\JakubMelka.PDF4QT_${{ env.pdf4qt_version }}.msix
          retention-days: 7
          compression-level: 0

      - name: Upload MSI package
        uses: actions/upload-artifact@v7
        with:
          name: '${{ env.msipackagefilename }}'
          path: .\pdf4qt\build\install\${{ env.msipackagefilename }}
          retention-days: 7
          compression-level: 0

      - name: 'Signing: Remove certificate'
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue $env:SM_CLIENT_CERT_FILE
