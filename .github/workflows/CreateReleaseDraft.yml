name: Create_Release_Draft

on:
  workflow_dispatch:
    inputs:
      allow_existing_release:
        description: 'Allow uploading assets to an existing release'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Install tools
        run: |
          sudo apt-get install gh
          sudo apt-get install jq

      - name: Read version
        id: get_version
        run: |
          version=$(grep -oP 'set\(PDF4QT_VERSION \K[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' "CMakeLists.txt")
          echo "Version: $version"
          echo "pdf4qt_version=$version" >> $GITHUB_ENV

      - name: Stop if release already exists
        run: |
          tag="v${{ env.pdf4qt_version }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [ "${{ inputs.allow_existing_release }}" != "true" ]; then
              echo "::error::Release $tag already exists. Refusing to upload assets because this would modify an existing release."
              echo "::error::Rerun this workflow with allow_existing_release=true only if updating that release is intentional."
              exit 1
            fi
            echo "Release $tag already exists and allow_existing_release=true, continuing."
          else
            echo "Release $tag does not exist, continuing."
          fi
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
      
      # Only the builds of master are released, test builds of other branches are ignored
      - name: Get latest run ID for Linux_AppImage
        id: get_linux_run_id
        run: |
          latest_run=$(gh run list --workflow=Linux_AppImage --branch master --json databaseId,conclusion --jq '.[0]')
          linux_run_id=$(echo $latest_run | jq -r .databaseId)
          echo "linux_run_id=$linux_run_id" >> $GITHUB_ENV
          conclusion=$(echo $latest_run | jq -r .conclusion)
          if [ "$conclusion" != "success" ]; then
            echo "Latest Linux_AppImage workflow run failed."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
      
      - name: Get latest run ID for Windows_MSI
        id: get_windows_run_id
        run: |
          latest_run=$(gh run list --workflow=Windows_MSI --branch master --json databaseId,conclusion --jq '.[0]')
          windows_run_id=$(echo $latest_run | jq -r .databaseId)
          echo "windows_run_id=$windows_run_id" >> $GITHUB_ENV
          conclusion=$(echo $latest_run | jq -r .conclusion)
          if [ "$conclusion" != "success" ]; then
            echo "Latest Windows_MSI workflow run failed."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
      
      - name: Download Linux_AppImage artifact
        run: |
          mkdir -p artifacts
          echo "Downloading artifacts from run ID: ${{ env.linux_run_id }}..."
          gh run download ${{ env.linux_run_id }} -D artifacts
          echo "Artifacts downloaded to artifacts directory."
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
      
      - name: Download Windows_MSI artifact
        run: |
          mkdir -p artifacts
          echo "Downloading artifacts from run ID: ${{ env.windows_run_id }}..."
          gh run download ${{ env.windows_run_id }} -D artifacts
          echo "Artifacts downloaded to artifacts directory."
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          
      # Each artifact is downloaded into a directory of its name, the files are moved out of them (the zip
      # archive of Windows is created by Windows_MSI, so it is the attested file)
      - name: Correct file paths
        run: |
          find artifacts -mindepth 2 -type f -exec sh -c 'mv "$1" "artifacts/$(basename "$1")_moved"' _ {} \;
          find artifacts -type d -empty -delete     
          for f in artifacts/*_moved; do
            mv "$f" "${f/_moved/}"
          done

      - name: List all files recursively
        run: |
          echo "Listing all files in artifacts:"
          find artifacts -type f -print

      # Each file of the release must have a GitHub attestation of a build of master of this repository
      - name: Verify attestations
        run: |
          for file in artifacts/*; do
            echo "::group::$file"
            gh attestation verify "$file" --repo "${{ github.repository }}" --source-ref refs/heads/master
            echo "::endgroup::"
          done
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Create Release Draft
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 'v${{ env.pdf4qt_version }}' 
          name: "Release of PDF4QT ${{ env.pdf4qt_version }} (Draft)"
          draft: true
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.MY_GITHUB_TOKEN }}
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            artifacts/*